[project]
name = "triage"
version = "0.1.0"
description = "Support question triage: answer, clarify or escalate"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bm25s>=0.3.16",
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "openai>=3.41.0",
    "pydantic>=2",
    "pydantic-ai>=2.63.0",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
triage = "triage.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
