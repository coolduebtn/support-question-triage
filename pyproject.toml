[project]
name = "triage"
version = "0.1.0"
description = "Support question triage: answer, clarify or escalate"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
triage = "triage.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
